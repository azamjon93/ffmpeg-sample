<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg UDP Stream Listener</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; margin-top: 50px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 800px; }
        video { width: 100%; background: #000; border-radius: 4px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-success { background: #28a745; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 10px; font-size: 0.9em; color: #666; }
        .status span { font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>FFmpeg UDP Stream Listener</h1>
    <video id="videoPlayer" controls autoplay muted></video>

    <div class="controls">
        <button id="btnConnect" class="btn-primary">Connect Stream</button>
        <button id="btnRecord" class="btn-success" disabled>Start Recording</button>
        <button id="btnStopRecord" class="btn-danger" disabled>Stop Recording</button>
    </div>

    <div class="status">
        Status: <span id="streamStatus">Disconnected</span> | 
        Recording: <span id="recordStatus">Idle</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<script>
    const video = document.getElementById('videoPlayer');
    const btnConnect = document.getElementById('btnConnect');
    const btnRecord = document.getElementById('btnRecord');
    const btnStopRecord = document.getElementById('btnStopRecord');
    const streamStatus = document.getElementById('streamStatus');
    const recordStatus = document.getElementById('recordStatus');

    let player = null;

    btnConnect.onclick = () => {
        if (player) {
            stopAll();
            return;
        }

        console.log('Connecting to MPEG-TS stream...');
        streamStatus.innerText = 'Connecting...';
        
        // mpegts.js handles the WebSocket connection and decoding of the TS stream
        player = mpegts.createPlayer({
            type: 'mse',
            isLive: true,
            url: `ws://${window.location.host}`,
            hasAudio: true,
            hasVideo: true
        }, {
            enableStashBuffer: false, // Minimize latency
            liveBufferLatencyChasing: true
        });

        player.attachMediaElement(video);
        player.load();
        player.play();

        player.on(mpegts.Events.ERROR, (type, detail, info) => {
            console.error('Player error:', type, detail, info);
        });

        player.on(mpegts.Events.STATISTICS_INFO, (stats) => {
            streamStatus.innerText = 'Connected (' + Math.floor(stats.speed / 1024) + ' KB/s)';
        });

        btnConnect.innerText = 'Disconnect';
        btnRecord.disabled = false;
    };

    function stopAll() {
        if (player) {
            player.pause();
            player.unload();
            player.detachMediaElement();
            player.destroy();
            player = null;
        }
        streamStatus.innerText = 'Disconnected';
        btnConnect.innerText = 'Connect Stream';
        btnRecord.disabled = true;
        btnStopRecord.disabled = true;
        recordStatus.innerText = 'Idle';
    }

    btnRecord.onclick = () => {
        // Since we are using mpegts.js, we need a way to tell the server to start recording.
        // We'll open a small secondary command socket or just use the player's internal transport if exposed.
        // For simplicity in this POC, we'll fetch a trigger URL or use a simple WS message if mpegts.js allows.
        // mpegts.js doesn't easily expose the raw WS, so we'll use a fetch for the command.
        fetch('/record/start').then(() => {
            recordStatus.innerText = 'Recording...';
            btnRecord.disabled = true;
            btnStopRecord.disabled = false;
        });
    };

    btnStopRecord.onclick = () => {
        fetch('/record/stop').then(() => {
            recordStatus.innerText = 'Idle';
            btnRecord.disabled = false;
            btnStopRecord.disabled = true;
        });
    };
</script>

</body>
</html>
